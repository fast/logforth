name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Concurrency strategy:
#   github.workflow: distinguish this workflow from others
#   github.event_name: distinguish `push` event from `pull_request` event
#   github.event.number: set to the number of the pull request if `pull_request` event
#   github.run_id: otherwise, it's a `push` event, only cancel if we rerun the workflow
#
# Reference:
#   https://docs.github.com/en/actions/using-jobs/using-concurrency
#   https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly toolchain
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component rustfmt
          --component clippy
          --allow-downgrade
          --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v cargo-binstall >/dev/null || \
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm --locked typos-cli hawkeye
          cargo binstall --no-confirm --locked \
            --pkg-url "https://github.com/tamasfe/taplo/releases/download/{ version }/taplo-linux-x86_64.gz" \
            --pkg-fmt bin \
            taplo-cli
      - name: Check lockfile
        run: cargo update -w --locked --verbose
      - name: Run linters
        run: cargo x lint
      - name: Check feature matrix
        run: cargo x check

  msrv:
    name: Resolve MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust-versions: ${{ steps.metadata.outputs.rust-versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read supported Rust versions
        id: metadata
        run: |
          msrv=$(yq -er '.workspace.package.rust-version' Cargo.toml)
          versions=$(jq -cn --arg msrv "$msrv" '[$msrv, "stable"]')
          echo "rust-versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests
    needs: msrv
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        rust-version: ${{ fromJSON(needs.msrv.outputs.rust-versions) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ matrix.rust-version }}
        run: >-
          rustup toolchain install ${{ matrix.rust-version }}
          --profile minimal
          --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      - name: Run tests
        run: cargo x test --no-capture
        shell: bash

  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [check, msrv, test]
    steps:
      - name: Check job results
        env:
          JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOBS"
