name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install nightly lint toolchain
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component clippy
          --component rustfmt
          --allow-downgrade
          --no-self-update

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: hawkeye,taplo-cli,typos-cli

      - name: Lint workspace
        run: cargo x lint

      - name: Check feature configurations
        run: cargo x check

  msrv:
    name: Resolve MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.rust.outputs.versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read supported Rust versions
        id: rust
        run: |
          msrv=$(yq -er '.workspace.package.rust-version' Cargo.toml)
          versions=$(jq -cn --arg msrv "$msrv" '[$msrv, "stable"]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    needs: msrv
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        rust: ${{ fromJSON(needs.msrv.outputs.versions) }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo x build

      - name: Run tests
        shell: bash
        run: cargo x test --no-capture

  required:
    name: Required
    if: ${{ always() }}
    needs: [lint, msrv, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOBS"
