[package]
name = "tests-integration"
publish = false

edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.release]
release = false

[dependencies]
logforth-core = { workspace = true, features = ["serde"] }

[dev-dependencies]
logforth = { workspace = true, features = [
  "append-async",
  "append-fastrace",
  "append-file",
  "append-journald",
  "append-opentelemetry",
  "append-syslog",
  "bridge-log",
  "bridge-log-serde",
  "diagnostic-fastrace",
  "diagnostic-task-local",
  "filter-rustlog",
  "layout-google-cloud-logging",
  "layout-json",
  "layout-logfmt",
  "layout-text",
  "starter-log",
] }
logforth-filter-rustlog = { workspace = true }
serde = { workspace = true }

[lib]
bench = false
doc = false
doctest = false
test = false

[lints]
workspace = true
